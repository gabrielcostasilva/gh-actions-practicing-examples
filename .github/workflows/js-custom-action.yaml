name: JS custom action

on: 
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: greet
        id: hello
        uses: gabrielcostasilva/gh-actions-js-custom-action@80b679240c7289043a917e14cba5c0abe0357224
        with:
          who-to-greet: John Doe
      - name: Get the output time
        run: echo "The time was ${{ steps.hello.outputs.time }}"
