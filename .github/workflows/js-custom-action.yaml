name: JS custom action

on: 
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: greet
        id: hello
        uses: gabrielcostasilva/gh-actions-js-custom-action@989fb0ffd74406749085885f23085b993a6a407d
        with:
          who-to-greet: John Doe
      - name: Get the output time
        run: echo "The time was ${{ steps.hello.outputs.time }}"
